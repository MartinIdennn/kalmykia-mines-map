<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рудники Калмыкии</title>

  <!-- Leaflet CSS (CDN unpkg) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="header">
    <h1>Рудники Калмыкии</h1>
  </header>

  <main id="main">
    <!-- Карта на весь экран -->
    <div id="map"></div>

    <!-- Панель рудника (оверлей, скрыта по умолчанию) -->
    <aside id="panel" class="hidden" aria-hidden="true">
      <button id="panel-close" type="button" aria-label="Закрыть">&times;</button>

      <div id="panel-content">
        <h2 id="mine-name"></h2>
        <p id="mine-description"></p>

        <!-- Галерея фото -->
        <section id="gallery-section">
          <h3>Галерея</h3>
          <div id="gallery" class="gallery"></div>
        </section>

        <!-- Прогресс сбора -->
        <section id="progress-section">
          <h3>Сбор средств</h3>
          <div class="progress">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <p id="progress-text" class="progress-text"></p>
        </section>

        <!-- Смета -->
        <section id="budget-section">
          <h3>Смета</h3>
          <table id="budget-table" class="budget-table">
            <thead>
              <tr><th>Статья</th><th>Сумма</th></tr>
            </thead>
            <tbody id="budget-body"></tbody>
            <tfoot>
              <tr><td>Итого</td><td id="budget-total"></td></tr>
            </tfoot>
          </table>
        </section>

        <!-- Форма доната -->
        <section id="donate-section">
          <h3>Поддержать рудник</h3>
          <form id="donate-form" novalidate>
            <div class="field">
              <label for="donor-name">Имя</label>
              <input id="donor-name" name="name" type="text" placeholder="Ваше имя" required />
            </div>
            <div class="field">
              <label for="donor-amount">Сумма, ₽</label>
              <input id="donor-amount" name="amount" type="number" min="1" step="1" placeholder="500" required />
            </div>
            <button id="donate-submit" type="submit">Поддержать</button>
            <p id="donate-error" class="error" role="alert"></p>
          </form>
        </section>

        <!-- Live-список донатеров -->
        <section id="donors-section">
          <h3>Донатеры</h3>
          <ul id="donors-list" class="donors-list"></ul>
        </section>
      </div>
    </aside>
  </main>

  <!-- Leaflet JS (CDN unpkg) -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="app.js"></script>
</body>
</html>
